 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Code</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background: #0b1120; color: #f8fafc; padding: 14px;
      max-width: 750px; margin: 0 auto;
      height: 100vh; height: 100dvh;
      display: flex; flex-direction: column;
    }
    .view {
      display: flex; flex-direction: column; gap: 10px;
      height: 100%; width: 100%;
    }
    .hidden { display: none !important; }

    .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    button {
      border: none; border-radius: 14px; padding: 16px;
      font-size: 1.1rem; font-weight: bold; color: #fff;
      cursor: pointer; touch-action: manipulation;
      transition: transform 0.1s;
    }
    button:active { transform: scale(0.96); }
    #openSaveBtn { background: #6366f1; }
    #copyBtn { background: #10b981; }
    #cameraBtn { background: #f59e0b; width: 100%; padding: 13px; font-size: 1.05rem; }
    #deleteBtn { background: #dc2626; padding: 14px; font-size: 1rem; }
    #pasteBtn { background: #0284c7; padding: 14px; font-size: 1rem; }
    #backBtn { background: #334155; width: 100%; padding: 14px; font-size: 1rem; }
    #pasteSaveBtn { background: #0284c7; width: 100%; padding: 14px; font-size: 1rem; }

    /* Small Image Preview with Spinner */
    .preview-box {
      position: relative;
      width: 76px; height: 76px;
      margin: 0 auto;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #f59e0b;
      background: #1e293b;
      flex-shrink: 0;
    }
    .preview-box img {
      width: 100%; height: 100%;
      object-fit: cover;
      opacity: 0.45;
    }
    .preview-overlay {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 4px;
      background: rgba(11, 17, 32, 0.5);
      color: #fbbf24; font-size: 0.8rem; font-weight: bold;
    }
    .spinner {
      width: 24px; height: 24px;
      border: 3px solid rgba(255, 255, 255, 0.25);
      border-top-color: #fbbf24;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Fullscreen Custom Camera Modal (Lens Style) */
    #cameraModal {
      position: fixed; inset: 0; z-index: 9999;
      background: #000;
      display: flex; flex-direction: column;
    }
    #cameraVideo {
      width: 100%; height: 100%;
      object-fit: cover;
    }
    .cam-top {
      position: absolute; top: 0; left: 0; right: 0;
      padding: 18px 16px;
      display: flex; align-items: center; justify-content: space-between;
      background: linear-gradient(to bottom, rgba(0,0,0,0.65), transparent);
    }
    #closeCamBtn {
      background: rgba(0,0,0,0.45);
      width: 44px; height: 44px; padding: 0;
      border-radius: 50%; font-size: 1.4rem;
      display: flex; align-items: center; justify-content: center;
    }
    .cam-bottom {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 28px 24px 36px;
      display: flex; align-items: center; justify-content: center; gap: 28px;
      background: linear-gradient(to top, rgba(0,0,0,0.75), transparent);
    }
    #galleryCamBtn {
      width: 56px; height: 56px; padding: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      border: 2px solid rgba(255, 255, 255, 0.85);
      display: flex; align-items: center; justify-content: center;
      position: absolute; left: 28px;
    }
    #shutterBtn {
      width: 74px; height: 74px; padding: 0;
      border-radius: 50%;
      background: #ffffff;
      border: 5px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 0 0 3px rgba(0,0,0,0.3);
    }

    .status {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      font-size: 0.95rem; font-weight: bold; min-height: 22px; color: #38bdf8;
      text-align: center;
    }

    #codeBox {
      flex: 1; width: 100%; background: #1e293b; color: #e2e8f0;
      border: 1px solid #334155; border-radius: 14px; padding: 14px;
      font-family: ui-monospace, Consolas, monospace; font-size: 0.95rem;
      line-height: 1.6; resize: none; outline: none;
    }
    input[type="text"] {
      width: 100%; background: #1e293b; color: #e2e8f0;
      border: 1px solid #334155; border-radius: 12px; padding: 12px;
      font-size: 0.95rem; outline: none;
    }
    #codeBox:focus, input:focus { border-color: #38bdf8; }

    #filesList {
      flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;
      padding-bottom: 10px;
    }
    .file-card {
      background: #1e293b; border: 1px solid #334155; border-radius: 14px;
      padding: 12px; display: flex; flex-direction: column; gap: 8px;
    }
    .file-header {
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
    }
    .file-title {
      font-weight: bold; color: #38bdf8; font-size: 1rem; word-break: break-all;
    }
    .file-actions { display: flex; gap: 6px; }
    .file-actions button {
      padding: 7px 12px; font-size: 0.85rem; border-radius: 10px;
    }
    .btn-mini-copy { background: #10b981; }
    .btn-mini-del { background: #dc2626; }
    .file-content {
      background: #0b1120; color: #cbd5e1; padding: 10px; border-radius: 10px;
      font-family: ui-monospace, Consolas, monospace; font-size: 0.85rem;
      white-space: pre-wrap; word-break: break-all; max-height: 160px; overflow-y: auto;
    }
    .empty-msg {
      text-align: center; color: #64748b; margin-top: 20px; font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <!-- Main Clipboard View -->
  <div id="mainView" class="view">
    <div class="buttons">
      <button id="openSaveBtn">Save</button>
      <button id="copyBtn">Copy</button>
    </div>

    <button id="cameraBtn">📷 Camera</button>
    <input type="file" id="galleryInput" accept="image/*" class="hidden">

    <!-- Small Image Preview with Spinner Overlay -->
    <div id="previewBox" class="preview-box hidden">
      <img id="previewImg" alt="preview">
      <div class="preview-overlay">
        <span class="spinner"></span>
        <span id="previewTimer">0s</span>
      </div>
    </div>

    <div class="status" id="status"></div>

    <textarea id="codeBox" dir="auto" placeholder="Codes....."></textarea>

    <div class="buttons">
      <button id="deleteBtn">Delete</button>
      <button id="pasteBtn">Paste</button>
    </div>
  </div>

  <!-- Saved Files View -->
  <div id="filesView" class="view hidden">
    <input type="text" id="fileNameInput" placeholder="File name (auto: code1, code2...)">
    <button id="pasteSaveBtn">Paste &amp; Save</button>

    <div class="status" id="fileStatus"></div>

    <div id="filesList"></div>

    <button id="backBtn">← Back</button>
  </div>

  <!-- Fullscreen Camera Modal with Gallery Button inside -->
  <div id="cameraModal" class="hidden">
    <video id="cameraVideo" autoplay playsinline></video>

    <div class="cam-top">
      <button id="closeCamBtn">←</button>
    </div>

    <div class="cam-bottom">
      <button id="galleryCamBtn" title="Gallery">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <polyline points="21 15 16 10 5 21"></polyline>
        </svg>
      </button>
      <button id="shutterBtn" title="Take Photo"></button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, set, push, remove, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const GEMINI_API_KEY = "AQ.Ab8RN6JmNqZiFLfp1MBxL" + "-cg6L-9DEpum4YCyCOj9c8AY8CS8g";

    const firebaseConfig = {
      apiKey: "AIzaSyA335HRWD4uJBgRqYZ3eyYGyzALhpPiVDM",
      authDomain: "quickclip-5ad69.firebaseapp.com",
      databaseURL: "https://quickclip-5ad69-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "quickclip-5ad69",
      storageBucket: "quickclip-5ad69.firebasestorage.app",
      messagingSenderId: "929214731654",
      appId: "1:929214731654:web:3086c3495003471cb68807",
      measurementId: "G-EQZ5V1TEPQ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const clipRef = ref(db, "currentClip");
    const filesRef = ref(db, "savedCodes");
    const lecturesRef = ref(db, "lectures");

    const mainView = document.getElementById("mainView");
    const filesView = document.getElementById("filesView");
    const codeBox = document.getElementById("codeBox");
    const statusEl = document.getElementById("status");
    const fileStatusEl = document.getElementById("fileStatus");
    const fileNameInput = document.getElementById("fileNameInput");
    const filesList = document.getElementById("filesList");
    const galleryInput = document.getElementById("galleryInput");
    const previewBox = document.getElementById("previewBox");
    const previewImg = document.getElementById("previewImg");
    const previewTimer = document.getElementById("previewTimer");

    const cameraModal = document.getElementById("cameraModal");
    const cameraVideo = document.getElementById("cameraVideo");

    let savedFiles = {};
    let currentLectures = "";
    let loadingTimer = null;
    let cameraStream = null;

    function showStatus(el, msg, color = "#38bdf8", time = 2500) {
      el.style.color = color;
      el.textContent = msg;
      if (time > 0) {
        setTimeout(() => { if (el.textContent === msg) el.textContent = ""; }, time);
      }
    }

    function startPreviewLoading(dataUrl) {
      stopPreviewLoading();
      previewImg.src = dataUrl;
      previewBox.classList.remove("hidden");
      statusEl.textContent = "";
      let seconds = 0;
      previewTimer.textContent = "0s";
      loadingTimer = setInterval(() => {
        seconds++;
        previewTimer.textContent = seconds + "s";
      }, 1000);
    }

    function stopPreviewLoading() {
      if (loadingTimer) {
        clearInterval(loadingTimer);
        loadingTimer = null;
      }
      previewBox.classList.add("hidden");
    }

    function escapeHtml(str) {
      return String(str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // --- Load Active Lectures from Firebase ---
    onValue(lecturesRef, (snapshot) => {
      const val = snapshot.val();
      if (!val) {
        currentLectures = "";
      } else if (typeof val === "string") {
        currentLectures = val;
      } else {
        currentLectures = JSON.stringify(val);
      }
    });

    // --- Main Clipboard ---
    onValue(clipRef, (snapshot) => {
      const val = snapshot.val() || "";
      if (codeBox.value !== val) codeBox.value = val;
    });

    document.getElementById("pasteBtn").addEventListener("click", async () => {
      try {
        const text = await navigator.clipboard.readText();
        if (!text) return showStatus(statusEl, "Null !", "#f87171");
        codeBox.value = text;
        await set(clipRef, text);
        showStatus(statusEl, "✓ Paste", "#10b981");
      } catch {
        showStatus(statusEl, "Paste manually (Ctrl+V)", "#fbbf24");
        codeBox.focus();
      }
    });

    codeBox.addEventListener("input", () => set(clipRef, codeBox.value));

    document.getElementById("copyBtn").addEventListener("click", async () => {
      if (!codeBox.value) return showStatus(statusEl, "Null !", "#f87171");
      try {
        await navigator.clipboard.writeText(codeBox.value);
        showStatus(statusEl, "✓ Copy", "#10b981");
      } catch {
        codeBox.select();
        document.execCommand("copy");
        showStatus(statusEl, "✓ Copy", "#10b981");
      }
    });

    document.getElementById("deleteBtn").addEventListener("click", async () => {
      if (!codeBox.value) return;
      codeBox.value = "";
      await set(clipRef, "");
      showStatus(statusEl, "✓ Delete", "#f87171");
    });

    // --- Switch Views ---
    document.getElementById("openSaveBtn").addEventListener("click", () => {
      mainView.classList.add("hidden");
      filesView.classList.remove("hidden");
    });

    document.getElementById("backBtn").addEventListener("click", () => {
      filesView.classList.add("hidden");
      mainView.classList.remove("hidden");
    });

    // --- Custom Camera Modal (with Gallery button inside) ---
    function closeCamera() {
      if (cameraStream) {
        cameraStream.getTracks().forEach((t) => t.stop());
        cameraStream = null;
      }
      cameraVideo.srcObject = null;
      cameraModal.classList.add("hidden");
    }

    document.getElementById("cameraBtn").addEventListener("click", async () => {
      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        cameraVideo.srcObject = cameraStream;
        cameraModal.classList.remove("hidden");
      } catch {
        // Fallback to gallery/file picker if camera permission denied or no camera
        galleryInput.value = "";
        galleryInput.click();
      }
    });

    document.getElementById("closeCamBtn").addEventListener("click", closeCamera);

    document.getElementById("galleryCamBtn").addEventListener("click", () => {
      galleryInput.value = "";
      galleryInput.click();
    });

    document.getElementById("shutterBtn").addEventListener("click", () => {
      if (!cameraVideo.videoWidth) return;
      const canvas = document.createElement("canvas");
      const maxWidth = 850;
      let width = cameraVideo.videoWidth;
      let height = cameraVideo.videoHeight;
      if (width > maxWidth) {
        height = Math.round((height * maxWidth) / width);
        width = maxWidth;
      }
      canvas.width = width;
      canvas.height = height;
      canvas.getContext("2d").drawImage(cameraVideo, 0, 0, width, height);
      const dataUrl = canvas.toDataURL("image/jpeg", 0.7);
      closeCamera();
      solveFromImage(dataUrl, dataUrl.split(",")[1]);
    });

    galleryInput.addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      closeCamera();
      try {
        const { dataUrl, base64 } = await compressImage(file);
        solveFromImage(dataUrl, base64);
      } catch (err) {
        showStatus(statusEl, "Error: " + err.message, "#f87171", 4000);
      }
    });

    function compressImage(file, maxWidth = 850) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement("canvas");
            let width = img.width;
            let height = img.height;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            canvas.width = width;
            canvas.height = height;
            canvas.getContext("2d").drawImage(img, 0, 0, width, height);
            const dataUrl = canvas.toDataURL("image/jpeg", 0.7);
            resolve({ dataUrl, base64: dataUrl.split(",")[1] });
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function getNextAutoName() {
      let maxNum = 0;
      Object.values(savedFiles).forEach((item) => {
        const match = /^code(\d+)$/i.exec((item.name || "").trim());
        if (match) {
          const num = parseInt(match[1], 10);
          if (num > maxNum) maxNum = num;
        }
      });
      return "code" + (maxNum + 1);
    }

    async function callGeminiFast(prompt, base64Image, maxRetries = 2) {
      for (let attempt = 1; attempt <= maxRetries; attempt++) {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 25000);

        try {
          const res = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${GEMINI_API_KEY}`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              signal: controller.signal,
              body: JSON.stringify({
                contents: [{
                  parts: [
                    { text: prompt },
                    { inline_data: { mime_type: "image/jpeg", data: base64Image } }
                  ]
                }],
                generationConfig: { responseMimeType: "application/json" }
              })
            }
          );
          clearTimeout(timeoutId);
          const data = await res.json();

          if (data.error) {
            const msg = data.error.message || "API Error";
            if ((res.status === 503 || res.status === 429 || msg.toLowerCase().includes("high demand")) && attempt < maxRetries) {
              await new Promise(r => setTimeout(r, 1200));
              continue;
            }
            throw new Error(msg);
          }
          return data;
        } catch (err) {
          clearTimeout(timeoutId);
          if (attempt < maxRetries && (err.name === "AbortError" || err.message.toLowerCase().includes("high demand"))) {
            await new Promise(r => setTimeout(r, 1000));
            continue;
          }
          throw err.name === "AbortError" ? new Error("Timeout. Try again.") : err;
        }
      }
    }

    async function solveFromImage(dataUrl, base64) {
      startPreviewLoading(dataUrl);

      try {
        const prompt = `Solve the coding question in this image quickly.
${currentLectures ? `Use the teacher's exact style/notes:\n${currentLectures}\n` : ""}
Rules:
1. Detect exam group (e.g. Group A -> "GA", Group B -> "GB", Group C -> "GC"). If none, set "group" to "".
2. Put ONLY pure working code in "code".
3. STRICTLY NO comments (no //, /* */, #, %) and NO explanations or markdown.
Return valid JSON only: {"group": "GA", "code": "..."}`;

        const data = await callGeminiFast(prompt, base64, 2);

        const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
        const parsed = JSON.parse(rawText);
        const finalCode = (parsed.code || "").trim();
        const saveName = (parsed.group || "").trim() || getNextAutoName();

        if (!finalCode) throw new Error("Empty code returned");

        codeBox.value = finalCode;
        await set(clipRef, finalCode);
        await push(filesRef, { name: saveName, code: finalCode, createdAt: Date.now() });

        stopPreviewLoading();
        showStatus(statusEl, `✓ Paste (${saveName})`, "#10b981", 3500);
      } catch (err) {
        stopPreviewLoading();
        showStatus(statusEl, "Error: " + err.message, "#f87171", 4000);
      }
    }

    // --- Saved Files (Manual Paste & Save) ---
    document.getElementById("pasteSaveBtn").addEventListener("click", async () => {
      try {
        const code = (await navigator.clipboard.readText()).trim();
        if (!code) return showStatus(fileStatusEl, "Null !", "#f87171");

        const name = fileNameInput.value.trim() || getNextAutoName();
        await push(filesRef, { name, code, createdAt: Date.now() });

        fileNameInput.value = "";
        showStatus(fileStatusEl, `✓ Saved (${name})`, "#10b981");
      } catch {
        showStatus(fileStatusEl, "Allow clipboard permission!", "#fbbf24");
      }
    });

    onValue(filesRef, (snapshot) => {
      savedFiles = snapshot.val() || {};
      filesList.innerHTML = "";

      const entries = Object.entries(savedFiles).reverse();
      if (entries.length === 0) {
        filesList.innerHTML = '<div class="empty-msg">No saved codes yet.</div>';
        return;
      }

      entries.forEach(([id, item]) => {
        const card = document.createElement("div");
        card.className = "file-card";
        card.innerHTML = `
          <div class="file-header">
            <span class="file-title">${escapeHtml(item.name || "code")}</span>
            <div class="file-actions">
              <button class="btn-mini-copy">Copy</button>
              <button class="btn-mini-del">Delete</button>
            </div>
          </div>
          <div class="file-content">${escapeHtml(item.code || "")}</div>
        `;

        card.querySelector(".btn-mini-copy").addEventListener("click", async () => {
          try {
            await navigator.clipboard.writeText(item.code || "");
            showStatus(fileStatusEl, `✓ Copy (${item.name})`, "#10b981");
          } catch {
            showStatus(fileStatusEl, "Copy failed", "#f87171");
          }
        });

        card.querySelector(".btn-mini-del").addEventListener("click", async () => {
          await remove(ref(db, `savedCodes/${id}`));
          showStatus(fileStatusEl, `✓ Delete (${item.name})`, "#f87171");
        });

        filesList.appendChild(card);
      });
    });
  </script>
</body>
</html>
