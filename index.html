<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Code</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background: #0b1120; color: #f8fafc; padding: 14px;
      max-width: 750px; margin: 0 auto;
      height: 100vh; height: 100dvh;
      display: flex; flex-direction: column;
    }
    .view {
      display: flex; flex-direction: column; gap: 10px;
      height: 100%; width: 100%;
    }
    .hidden { display: none !important; }

    .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .ai-bar { display: flex; gap: 8px; align-items: center; }

    button {
      border: none; border-radius: 14px; padding: 16px;
      font-size: 1.1rem; font-weight: bold; color: #fff;
      cursor: pointer; touch-action: manipulation;
      transition: transform 0.1s;
    }
    button:active { transform: scale(0.97); }
    #openSaveBtn { background: #6366f1; }
    #copyBtn { background: #10b981; }
    #deleteBtn { background: #dc2626; padding: 14px; font-size: 1rem; }
    #pasteBtn { background: #0284c7; padding: 14px; font-size: 1rem; }
    #backBtn, #aiBackBtn {
      background: #334155; width: 100%; padding: 14px; font-size: 1rem;
    }
    #pasteSaveBtn, #addSubjectBtn {
      background: #0284c7; width: 100%; padding: 12px; font-size: 0.95rem;
    }

    #subjectSelect {
      flex: 1; background: #1e293b; color: #f8fafc;
      border: 1px solid #334155; border-radius: 12px;
      padding: 11px 12px; font-size: 0.95rem; font-weight: bold; outline: none;
    }
    #cameraBtn {
      background: #f59e0b; padding: 11px 16px; font-size: 1rem; border-radius: 12px;
    }
    #aiSettingsBtn {
      background: #334155; padding: 11px 14px; font-size: 1rem; border-radius: 12px;
    }

    .status {
      text-align: center; font-size: 0.9rem; min-height: 20px; color: #38bdf8;
    }
    #codeBox {
      flex: 1; width: 100%; background: #1e293b; color: #e2e8f0;
      border: 1px solid #334155; border-radius: 14px; padding: 14px;
      font-family: ui-monospace, Consolas, monospace; font-size: 0.95rem;
      line-height: 1.6; resize: none; outline: none;
    }
    input[type="text"], .lecture-box {
      width: 100%; background: #1e293b; color: #e2e8f0;
      border: 1px solid #334155; border-radius: 12px; padding: 12px;
      font-size: 0.9rem; outline: none;
    }
    .lecture-box {
      min-height: 110px; resize: vertical;
      font-family: ui-monospace, Consolas, monospace;
    }
    #codeBox:focus, input:focus, .lecture-box:focus, #subjectSelect:focus { border-color: #38bdf8; }

    #filesList, .settings-scroll {
      flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;
      padding-bottom: 10px;
    }
    .file-card, .setting-card {
      background: #1e293b; border: 1px solid #334155; border-radius: 14px;
      padding: 12px; display: flex; flex-direction: column; gap: 8px;
    }
    .setting-label { font-size: 0.85rem; color: #38bdf8; font-weight: bold; }
    .file-header {
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
    }
    .file-title {
      font-weight: bold; color: #38bdf8; font-size: 1rem; word-break: break-all;
    }
    .file-actions { display: flex; gap: 6px; }
    .file-actions button {
      padding: 7px 12px; font-size: 0.85rem; border-radius: 10px;
    }
    .btn-mini-copy { background: #10b981; }
    .btn-mini-del { background: #dc2626; }
    .btn-mini-save { background: #0284c7; }
    .file-content {
      background: #0b1120; color: #cbd5e1; padding: 10px; border-radius: 10px;
      font-family: ui-monospace, Consolas, monospace; font-size: 0.85rem;
      white-space: pre-wrap; word-break: break-all; max-height: 160px; overflow-y: auto;
    }
    .empty-msg {
      text-align: center; color: #64748b; margin-top: 20px; font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <!-- Main Clipboard View -->
  <div id="mainView" class="view">
    <div class="buttons">
      <button id="openSaveBtn">Save</button>
      <button id="copyBtn">Copy</button>
    </div>

    <div class="ai-bar">
      <select id="subjectSelect"></select>
      <button id="cameraBtn">📷</button>
      <button id="aiSettingsBtn">⚙️</button>
    </div>
    <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden">

    <div class="status" id="status"></div>

    <textarea id="codeBox" dir="auto" placeholder="Codes....."></textarea>

    <div class="buttons">
      <button id="deleteBtn">Delete</button>
      <button id="pasteBtn">Paste</button>
    </div>
  </div>

  <!-- Saved Files View -->
  <div id="filesView" class="view hidden">
    <input type="text" id="fileNameInput" placeholder="File name (auto: code1, code2...)">
    <button id="pasteSaveBtn">Paste &amp; Save</button>

    <div class="status" id="fileStatus"></div>

    <div id="filesList"></div>

    <button id="backBtn">← Back</button>
  </div>

  <!-- Settings View (Subjects & Lectures Only) -->
  <div id="aiSettingsView" class="view hidden">
    <div class="settings-scroll">
      <div class="setting-card">
        <span class="setting-label">➕ Add New Subject</span>
        <input type="text" id="newSubName" placeholder="Subject name (e.g. Data Structure)">
        <textarea id="newSubLecture" class="lecture-box" placeholder="Paste teacher's lectures, sample codes, and rules here..."></textarea>
        <button id="addSubjectBtn">Add Subject</button>
      </div>

      <div id="subjectsList" style="display:flex; flex-direction:column; gap:10px;"></div>
    </div>

    <div class="status" id="aiStatus"></div>
    <button id="aiBackBtn">← Back</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, set, push, remove, update, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const GEMINI_API_KEY = "AQ.Ab8RN6JmNqZiFLfp1MBxL" + "-cg6L-9DEpum4YCyCOj9c8AY8CS8g";

    const firebaseConfig = {
      apiKey: "AIzaSyA335HRWD4uJBgRqYZ3eyYGyzALhpPiVDM",
      authDomain: "quickclip-5ad69.firebaseapp.com",
      databaseURL: "https://quickclip-5ad69-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "quickclip-5ad69",
      storageBucket: "quickclip-5ad69.firebasestorage.app",
      messagingSenderId: "929214731654",
      appId: "1:929214731654:web:3086c3495003471cb68807",
      measurementId: "G-EQZ5V1TEPQ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const clipRef = ref(db, "currentClip");
    const filesRef = ref(db, "savedCodes");
    const subjectsRef = ref(db, "aiSubjects");

    const mainView = document.getElementById("mainView");
    const filesView = document.getElementById("filesView");
    const aiSettingsView = document.getElementById("aiSettingsView");
    const codeBox = document.getElementById("codeBox");
    const statusEl = document.getElementById("status");
    const fileStatusEl = document.getElementById("fileStatus");
    const aiStatusEl = document.getElementById("aiStatus");
    const fileNameInput = document.getElementById("fileNameInput");
    const filesList = document.getElementById("filesList");
    const subjectSelect = document.getElementById("subjectSelect");
    const subjectsList = document.getElementById("subjectsList");
    const cameraInput = document.getElementById("cameraInput");

    let savedFiles = {};
    let subjectsMap = {};

    function showStatus(el, msg, color = "#38bdf8", time = 2200) {
      el.style.color = color;
      el.textContent = msg;
      if (time > 0) {
        setTimeout(() => { if (el.textContent === msg) el.textContent = ""; }, time);
      }
    }

    function escapeHtml(str) {
      return String(str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // --- Main Clipboard ---
    onValue(clipRef, (snapshot) => {
      const val = snapshot.val() || "";
      if (codeBox.value !== val) codeBox.value = val;
    });

    document.getElementById("pasteBtn").addEventListener("click", async () => {
      try {
        const text = await navigator.clipboard.readText();
        if (!text) return showStatus(statusEl, "Null !", "#f87171");
        codeBox.value = text;
        await set(clipRef, text);
        showStatus(statusEl, "✓ Paste", "#38bdf8");
      } catch {
        showStatus(statusEl, "Paste manually (Ctrl+V)", "#fbbf24");
        codeBox.focus();
      }
    });

    codeBox.addEventListener("input", () => set(clipRef, codeBox.value));

    document.getElementById("copyBtn").addEventListener("click", async () => {
      if (!codeBox.value) return showStatus(statusEl, "Null !", "#f87171");
      try {
        await navigator.clipboard.writeText(codeBox.value);
        showStatus(statusEl, "✓ Copy", "#34d399");
      } catch {
        codeBox.select();
        document.execCommand("copy");
        showStatus(statusEl, "✓ Copy", "#34d399");
      }
    });

    document.getElementById("deleteBtn").addEventListener("click", async () => {
      if (!codeBox.value) return;
      codeBox.value = "";
      await set(clipRef, "");
      showStatus(statusEl, "✓ Delete", "#f87171");
    });

    // --- Switch Views ---
    document.getElementById("openSaveBtn").addEventListener("click", () => {
      mainView.classList.add("hidden");
      filesView.classList.remove("hidden");
    });

    document.getElementById("backBtn").addEventListener("click", () => {
      filesView.classList.add("hidden");
      mainView.classList.remove("hidden");
    });

    document.getElementById("aiSettingsBtn").addEventListener("click", () => {
      mainView.classList.add("hidden");
      aiSettingsView.classList.remove("hidden");
    });

    document.getElementById("aiBackBtn").addEventListener("click", () => {
      aiSettingsView.classList.add("hidden");
      mainView.classList.remove("hidden");
    });

    // --- Subjects Management ---
    document.getElementById("addSubjectBtn").addEventListener("click", async () => {
      const name = document.getElementById("newSubName").value.trim();
      const lecture = document.getElementById("newSubLecture").value.trim();
      if (!name) return showStatus(aiStatusEl, "Enter subject name!", "#f87171");

      await push(subjectsRef, { name, lecture });
      document.getElementById("newSubName").value = "";
      document.getElementById("newSubLecture").value = "";
      showStatus(aiStatusEl, `✓ Added (${name})`, "#34d399");
    });

    onValue(subjectsRef, (snapshot) => {
      subjectsMap = snapshot.val() || {};
      const prevSelected = subjectSelect.value;
      subjectSelect.innerHTML = "";
      subjectsList.innerHTML = "";

      const entries = Object.entries(subjectsMap);
      if (entries.length === 0) {
        subjectSelect.innerHTML = `<option value="">No Subjects (Open ⚙️)</option>`;
        subjectsList.innerHTML = `<div class="empty-msg">No subjects yet. Add one above.</div>`;
        return;
      }

      entries.forEach(([id, sub]) => {
        const opt = document.createElement("option");
        opt.value = id;
        opt.textContent = sub.name || "Subject";
        subjectSelect.appendChild(opt);

        const card = document.createElement("div");
        card.className = "setting-card";
        card.innerHTML = `
          <div class="file-header">
            <span class="file-title">${escapeHtml(sub.name)}</span>
            <div class="file-actions">
              <button class="btn-mini-save">Update</button>
              <button class="btn-mini-del">Delete</button>
            </div>
          </div>
          <textarea class="lecture-box" placeholder="Lectures & teacher's code...">${escapeHtml(sub.lecture || "")}</textarea>
        `;

        const textarea = card.querySelector("textarea");
        card.querySelector(".btn-mini-save").addEventListener("click", async () => {
          await update(ref(db, `aiSubjects/${id}`), { lecture: textarea.value.trim() });
          showStatus(aiStatusEl, `✓ Updated (${sub.name})`, "#34d399");
        });

        card.querySelector(".btn-mini-del").addEventListener("click", async () => {
          await remove(ref(db, `aiSubjects/${id}`));
          showStatus(aiStatusEl, `✓ Deleted (${sub.name})`, "#f87171");
        });

        subjectsList.appendChild(card);
      });

      if (prevSelected && subjectsMap[prevSelected]) {
        subjectSelect.value = prevSelected;
      }
    });

    // --- Camera & Gemini Vision ---
    document.getElementById("cameraBtn").addEventListener("click", () => {
      cameraInput.value = "";
      cameraInput.click();
    });

    function compressImage(file, maxWidth = 1280) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement("canvas");
            let width = img.width;
            let height = img.height;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            canvas.width = width;
            canvas.height = height;
            canvas.getContext("2d").drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL("image/jpeg", 0.8).split(",")[1]);
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    cameraInput.addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const subId = subjectSelect.value;
      const subject = subjectsMap[subId] || { name: "General", lecture: "" };

      showStatus(statusEl, "⏳ Solving...", "#fbbf24", 0);

      try {
        const base64Image = await compressImage(file);
        const prompt = `You are solving an exam/lab question shown in this image for the subject: "${subject.name}".
${subject.lecture ? `Strictly follow the teacher's lecture notes, syntax, and coding style below:\n${subject.lecture}\n` : ""}
Tasks:
1. Check if the image mentions an exam group (e.g., "Group A", "Group B", "Group C", "G-A", "G-B", etc.).
   - If Group A -> set "group" to "GA"
   - If Group B -> set "group" to "GB"
   - If Group C -> set "group" to "GC" (and so on for any letter/number)
   - If NO group is mentioned -> set "group" to "${subject.name}"
2. Write ONLY the final clean working code in the "code" field (no markdown backticks, no extra explanations).

Return ONLY valid JSON in this exact format:
{"group": "GA", "code": "..."}`;

        const res = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`,
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [{
                parts: [
                  { text: prompt },
                  { inline_data: { mime_type: "image/jpeg", data: base64Image } }
                ]
              }],
              generationConfig: { responseMimeType: "application/json" }
            })
          }
        );

        const data = await res.json();
        if (data.error) throw new Error(data.error.message);

        const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
        const parsed = JSON.parse(rawText);
        const finalCode = (parsed.code || "").trim();
        const saveName = (parsed.group || subject.name || "AI").trim();

        if (!finalCode) throw new Error("Empty code returned");

        codeBox.value = finalCode;
        await set(clipRef, finalCode);
        await push(filesRef, { name: saveName, code: finalCode, createdAt: Date.now() });

        showStatus(statusEl, `✓ Saved as ${saveName}`, "#34d399", 3000);
      } catch (err) {
        showStatus(statusEl, "Error: " + err.message, "#f87171", 4000);
      }
    });

    // --- Saved Files (Manual Paste & Save) ---
    function getNextAutoName() {
      let maxNum = 0;
      Object.values(savedFiles).forEach((item) => {
        const match = /^code(\d+)$/i.exec((item.name || "").trim());
        if (match) {
          const num = parseInt(match[1], 10);
          if (num > maxNum) maxNum = num;
        }
      });
      return "code" + (maxNum + 1);
    }

    document.getElementById("pasteSaveBtn").addEventListener("click", async () => {
      try {
        const code = (await navigator.clipboard.readText()).trim();
        if (!code) return showStatus(fileStatusEl, "Null !", "#f87171");

        const name = fileNameInput.value.trim() || getNextAutoName();
        await push(filesRef, { name, code, createdAt: Date.now() });

        fileNameInput.value = "";
        showStatus(fileStatusEl, `✓ Saved (${name})`, "#34d399");
      } catch {
        showStatus(fileStatusEl, "Allow clipboard permission!", "#fbbf24");
      }
    });

    onValue(filesRef, (snapshot) => {
      savedFiles = snapshot.val() || {};
      filesList.innerHTML = "";

      const entries = Object.entries(savedFiles).reverse();
      if (entries.length === 0) {
        filesList.innerHTML = '<div class="empty-msg">No saved codes yet.</div>';
        return;
      }

      entries.forEach(([id, item]) => {
        const card = document.createElement("div");
        card.className = "file-card";
        card.innerHTML = `
          <div class="file-header">
            <span class="file-title">${escapeHtml(item.name || "code")}</span>
            <div class="file-actions">
              <button class="btn-mini-copy">Copy</button>
              <button class="btn-mini-del">Delete</button>
            </div>
          </div>
          <div class="file-content">${escapeHtml(item.code || "")}</div>
        `;

        card.querySelector(".btn-mini-copy").addEventListener("click", async () => {
          try {
            await navigator.clipboard.writeText(item.code || "");
            showStatus(fileStatusEl, `✓ Copy (${item.name})`, "#34d399");
          } catch {
            showStatus(fileStatusEl, "Copy failed", "#f87171");
          }
        });

        card.querySelector(".btn-mini-del").addEventListener("click", async () => {
          await remove(ref(db, `savedCodes/${id}`));
          showStatus(fileStatusEl, `✓ Delete (${item.name})`, "#f87171");
        });

        filesList.appendChild(card);
      });
    });
  </script>
</body>
</html>
